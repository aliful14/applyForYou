# Publish the /website folder to GitHub Pages from the develop branch.
#
# ONE-TIME SETUP (required or deploy will fail):
# 1. Repo → Settings → Pages
# 2. Under "Build and deployment", set Source to "GitHub Actions" (NOT "Deploy from a branch").
# 3. Save. Re-run this workflow from the Actions tab if needed.
#
# Optional: first run may ask you to approve the "github-pages" environment — click Approve.
name: Deploy GitHub Pages

on:
  push:
    branches: ["develop"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
