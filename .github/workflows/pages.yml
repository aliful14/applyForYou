# Publishes /website to the gh-pages branch. No GitHub "Actions" Pages API — avoids 404 setup errors.
#
# ONE-TIME GITHUB SETUP:
# 1. Repo → Settings → Pages
# 2. Build and deployment → Source: "Deploy from a branch" (NOT "GitHub Actions")
# 3. Branch: gh-pages, folder: / (root) → Save
# 4. After the first workflow run creates gh-pages, pick that branch in step 3 if it was not listed yet.
#
# Site URL: https://<user>.github.io/<repo>/  (or your custom domain once DNS + CNAME are set)
name: Deploy GitHub Pages

on:
  push:
    branches: ["develop"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish site to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website
          publish_branch: gh-pages
